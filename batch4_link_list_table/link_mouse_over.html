<!doctype html>
<!-- link_mouse_over.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Mouse Over</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      a {
        text-decoration: none;
        color: #2563eb;
        padding: 4px 8px;
        transition: 0.3s;
      }
      a:hover {
        background: #2563eb;
        color: #fff;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Efek Mouse Over</h1>
    <p><a href="#">Arahkan mouse ke sini</a></p>
    <p><a href="#">Link kedua</a></p>
  </body>
</html>
