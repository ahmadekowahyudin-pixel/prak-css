<!doctype html>
<!-- list_position.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Position</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      ul {
        border: 1px solid #333;
        width: 250px;
        background: #f3f4f6;
        margin-bottom: 15px;
      }
      .a {
        list-style-position: outside;
      }
      .b {
        list-style-position: inside;
      }
    </style>
  </head>
  <body>
    <h3>outside (default)</h3>
    <ul class="a">
      <li>Item satu yang cukup panjang sampai turun baris</li>
      <li>Item dua</li>
    </ul>
    <h3>inside</h3>
    <ul class="b">
      <li>Item satu yang cukup panjang sampai turun baris</li>
      <li>Item dua</li>
    </ul>
  </body>
</html>
