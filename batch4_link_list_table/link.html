<!doctype html>
<!-- link.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      a:link {
        color: blue;
      }
      a:visited {
        color: purple;
      }
      a:hover {
        color: red;
        text-decoration: underline;
      }
      a:active {
        color: orange;
      }
    </style>
  </head>
  <body>
    <h1>Status Link</h1>
    <p><a href="#a">Link belum dikunjungi</a></p>
    <p>
      <a href="https://example.com"
        >Link ke example.com (visited jika pernah dibuka)</a
      >
    </p>
    <p>Urutan: link, visited, hover, active (LoVe HAte).</p>
  </body>
</html>
