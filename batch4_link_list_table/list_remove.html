<!doctype html>
<!-- list_remove.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Remove</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        width: 200px;
      }
      li {
        padding: 8px;
        border-bottom: 1px solid #ccc;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <h1>Hapus Bullet</h1>
    <ul>
      <li>Beranda</li>
      <li>Tentang</li>
      <li>Kontak</li>
    </ul>
  </body>
</html>
