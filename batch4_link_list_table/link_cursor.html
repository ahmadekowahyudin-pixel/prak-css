<!doctype html>
<!-- link_cursor.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Cursor</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      span {
        display: inline-block;
        padding: 10px 15px;
        margin: 5px;
        background: #dbeafe;
        border: 1px solid #2563eb;
      }
      .a {
        cursor: pointer;
      }
      .b {
        cursor: help;
      }
      .c {
        cursor: wait;
      }
      .d {
        cursor: crosshair;
      }
      .e {
        cursor: not-allowed;
      }
      .f {
        cursor: move;
      }
      .g {
        cursor: text;
      }
    </style>
  </head>
  <body>
    <h1>Cursor</h1>
    <span class="a">pointer</span><span class="b">help</span
    ><span class="c">wait</span><span class="d">crosshair</span
    ><span class="e">not-allowed</span><span class="f">move</span
    ><span class="g">text</span>
  </body>
</html>
