<!DOCTYPE html>
<!-- table_warna.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Warna</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        th,
        td {
            text-align: left
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #fff
        }

        th {
            background: #16a34a;
            color: #fff
        }

        td {
            background: #dcfce7;
            color: #14532d
        }

        tr:nth-child(2) td {
            background: #fef9c3
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Nama</th>
            <th>Kota</th>
            <th>Umur</th>
        </tr>
        <tr>
            <td>Andi</td>
            <td>Pekanbaru</td>
            <td>21</td>
        </tr>
        <tr>
            <td>Budi</td>
            <td>Medan</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Citra</td>
            <td>Padang</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Dewi</td>
            <td>Jakarta</td>
            <td>28</td>
        </tr>
    </table>
</body>

</html>
