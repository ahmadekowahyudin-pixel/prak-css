<!doctype html>
<!-- link_button.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Button</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      a.btn {
        display: inline-block;
        padding: 10px 20px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        margin: 5px;
      }
      a.btn:hover {
        background: #1d4ed8;
      }
      a.btn:active {
        background: #1e3a8a;
      }
      a.out {
        background: #fff;
        color: #2563eb;
        border: 2px solid #2563eb;
      }
      a.out:hover {
        background: #2563eb;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Link Jadi Tombol</h1>
    <a class="btn" href="#">Tombol Biru</a
    ><a class="btn out" href="#">Tombol Outline</a>
  </body>
</html>
