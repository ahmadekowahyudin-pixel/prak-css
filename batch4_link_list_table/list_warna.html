<!doctype html>
<!-- list_warna.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Warna</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      ol {
        background: #dbeafe;
        padding: 15px 15px 15px 40px;
        width: 250px;
      }
      ul {
        background: #fef3c7;
        padding: 15px 15px 15px 40px;
        width: 250px;
      }
      li {
        background: #fff;
        margin: 5px 0;
        padding: 5px;
        color: #1e3a8a;
      }
      li::marker {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <ol>
      <li>Item satu</li>
      <li>Item dua</li>
      <li>Item tiga</li>
    </ol>
    <ul>
      <li>Item A</li>
      <li>Item B</li>
    </ul>
  </body>
</html>
