<!doctype html>
<!-- list.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      ul.a {
        list-style-type: circle;
      }
      ul.b {
        list-style-type: square;
      }
      ol.c {
        list-style-type: upper-roman;
      }
      ol.d {
        list-style-type: lower-alpha;
      }
    </style>
  </head>
  <body>
    <h3>ul circle</h3>
    <ul class="a">
      <li>Satu</li>
      <li>Dua</li>
    </ul>
    <h3>ul square</h3>
    <ul class="b">
      <li>Satu</li>
      <li>Dua</li>
    </ul>
    <h3>ol upper-roman</h3>
    <ol class="c">
      <li>Satu</li>
      <li>Dua</li>
    </ol>
    <h3>ol lower-alpha</h3>
    <ol class="d">
      <li>Satu</li>
      <li>Dua</li>
    </ol>
  </body>
</html>
