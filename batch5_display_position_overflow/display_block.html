<!DOCTYPE html>
<!-- display_block.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Block</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        span {
            background: #dbeafe;
            padding: 5px
        }

        .blk {
            display: block;
            background: #fef3c7;
            padding: 5px;
            margin: 5px 0
        }

        a {
            display: block;
            background: #dcfce7;
            padding: 8px;
            margin: 5px 0;
            width: 150px;
            text-decoration: none
        }
    </style>
</head>

<body>
    <h1>Display Block</h1><span>Span inline</span> <span>Span inline</span><br><br><span class="blk">Span dengan
        display:block</span><a href="#">Link block 1</a><a href="#">Link block 2</a>
</body>

</html>
