<!DOCTYPE html>
<!-- position_static.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Static</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        div {
            position: static;
            background: #dbeafe;
            border: 2px solid #2563eb;
            padding: 15px;
            top: 50px;
            left: 50px
        }
    </style>
</head>

<body>
    <h1>position: static</h1>
    <div>Default. Properti top/left tidak berpengaruh, elemen mengikuti alur normal.</div>
</body>

</html>
