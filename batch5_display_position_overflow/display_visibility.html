<!DOCTYPE html>
<!-- display_visibility.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Visibility</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        .box {
            background: #dbeafe;
            border: 1px solid #2563eb;
            padding: 10px;
            margin: 5px 0
        }

        .hide {
            visibility: hidden
        }
    </style>
</head>

<body>
    <h1>visibility: hidden</h1>
    <div class="box">Box 1</div>
    <div class="box hide">Box 2 (tak terlihat, tetapi ruangnya tetap ada)</div>
    <div class="box">Box 3</div>
</body>

</html>
