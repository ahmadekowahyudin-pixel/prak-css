<!DOCTYPE html>
<!-- position_relative.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Relative</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        .a {
            position: relative;
            left: 40px;
            top: 20px;
            background: #dbeafe;
            border: 2px solid #2563eb;
            padding: 15px
        }

        .b {
            background: #fef3c7;
            padding: 15px;
            margin-top: 10px
        }
    </style>
</head>

<body>
    <h1>position: relative</h1>
    <div class="a">Bergeser 40px dari kiri dan 20px dari atas posisi aslinya</div>
    <div class="b">Elemen setelahnya tidak ikut bergeser</div>
</body>

</html>
