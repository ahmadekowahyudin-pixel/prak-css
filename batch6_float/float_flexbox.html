<!DOCTYPE html>
<!-- float_flexbox.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float vs Flexbox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        img {
            width: 120px;
            height: 80px
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px
        }

        .box {
            flex: 1;
            padding: 20px;
            background: #dbeafe;
            border: 1px solid #2563eb;
            text-align: center
        }
    </style>
</head>

<body>
    <h1>Flexbox (pengganti float)</h1>
    <div class="row">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <div class="row">
        <div class="box" style="flex:2">2x lebar</div>
        <div class="box">1x</div>
    </div>
</body>

</html>
