<!DOCTYPE html>
<!-- float_grid.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Grid</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        .row::after {
            content: "";
            display: table;
            clear: both
        }

        .col {
            float: left;
            padding: 10px;
            min-height: 60px;
            border: 1px solid #fff;
            color: #fff;
            text-align: center;
            line-height: 40px
        }

        .c4 {
            width: 33.33%;
            background: #2563eb
        }

        .c6 {
            width: 50%;
            background: #16a34a
        }

        .c12 {
            width: 100%;
            background: #dc2626
        }

        .c3 {
            width: 25%;
            background: #9333ea
        }
    </style>
</head>

<body>
    <h1>Grid dengan Float</h1>
    <div class="row">
        <div class="col c12">12 kolom</div>
    </div>
    <div class="row">
        <div class="col c6">6</div>
        <div class="col c6">6</div>
    </div>
    <div class="row">
        <div class="col c4">4</div>
        <div class="col c4">4</div>
        <div class="col c4">4</div>
    </div>
    <div class="row">
        <div class="col c3">3</div>
        <div class="col c3">3</div>
        <div class="col c3">3</div>
        <div class="col c3">3</div>
    </div>
</body>

</html>
