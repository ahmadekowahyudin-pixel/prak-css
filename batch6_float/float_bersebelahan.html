<!DOCTYPE html>
<!-- float_bersebelahan.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Bersebelahan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        img {
            width: 120px;
            height: 80px
        }

        .box {
            float: left;
            width: 30%;
            margin: 1.5%;
            padding: 15px;
            background: #dbeafe;
            border: 1px solid #2563eb;
            box-sizing: border-box;
            height: 100px
        }
    </style>
</head>

<body>
    <h1>Float Bersebelahan</h1>
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
</body>

</html>
