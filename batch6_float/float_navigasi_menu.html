<!DOCTYPE html>
<!-- float_navigasi_menu.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Navigasi Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            background: #1f2937;
            overflow: hidden
        }

        li {
            float: left
        }

        li a {
            display: block;
            color: #fff;
            padding: 14px 20px;
            text-decoration: none
        }

        li a:hover {
            background: #2563eb
        }

        li.r {
            float: right
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Produk</a></li>
        <li><a href="#">Tentang</a></li>
        <li class="r"><a href="#">Login</a></li>
    </ul>
    <p style="padding:20px">Menu horizontal dengan float.</p>
</body>

</html>
