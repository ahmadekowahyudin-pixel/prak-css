<!DOCTYPE html>
<!-- navigation_bar_horizontal_right_border.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Horizontal Kanan Border</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            background: #1f2937;
            overflow: hidden
        }

        li {
            float: left
        }

        li a {
            display: block;
            color: #fff;
            padding: 14px 18px;
            text-decoration: none
        }

        li a:hover {
            background: #2563eb
        }

        li a.active {
            background: #16a34a
        }

        li {
            border-right: 1px solid #4b5563
        }

        li:last-child {
            border-right: none
        }

        li.r {
            float: right;
            border-right: none;
            border-left: 1px solid #4b5563
        }
    </style>
</head>

<body>
    <ul>
        <li><a class="active" href="#">Beranda</a></li>
        <li><a href="#">Berita</a></li>
        <li><a href="#">Kontak</a></li>
        <li class="r"><a href="#">Tentang</a></li>
    </ul>
    <p style="padding:20px">Pemisah border antar item.</p>
</body>

</html>
