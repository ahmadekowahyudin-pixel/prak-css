<!DOCTYPE html>
<!-- navigation_bar_vertical.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Vertikal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0
        }

        ul {
            list-style: none;
            margin: 20px;
            padding: 0;
            width: 200px;
            background: #f3f4f6;
            border: 1px solid #d1d5db
        }

        li a {
            display: block;
            color: #111827;
            padding: 10px 16px;
            text-decoration: none;
            border-bottom: 1px solid #d1d5db
        }

        li a:hover {
            background: #2563eb;
            color: #fff
        }

        li a.active {
            background: #16a34a;
            color: #fff
        }

        li:last-child a {
            border-bottom: none
        }
    </style>
</head>

<body>
    <ul>
        <li><a class="active" href="#">Beranda</a></li>
        <li><a href="#">Berita</a></li>
        <li><a href="#">Kontak</a></li>
        <li><a href="#">Tentang</a></li>
    </ul>
</body>

</html>
