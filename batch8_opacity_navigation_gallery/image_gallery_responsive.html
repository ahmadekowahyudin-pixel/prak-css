<!DOCTYPE html>

<html lang="id">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Responsive</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        .g {
            float: left;
            width: 25%;
            padding: 6px
        }

        .g img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ccc
        }

        .g div {
            padding: 8px;
            text-align: center
        }

        .clearfix::after {
            content: "";
            display: table;
            clear: both
        }

        @media(max-width:700px) {
            .g {
                width: 50%
            }
        }

        @media(max-width:400px) {
            .g {
                width: 100%
            }
        }
    </style>
</head>
