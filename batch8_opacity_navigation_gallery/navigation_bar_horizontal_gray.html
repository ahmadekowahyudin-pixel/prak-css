<!DOCTYPE html>
<!-- navigation_bar_horizontal_gray.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Horizontal Gray</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            background: #e5e7eb;
            overflow: hidden;
            border-bottom: 2px solid #9ca3af
        }

        li {
            float: left
        }

        li a {
            display: block;
            color: #374151;
            padding: 14px 18px;
            text-decoration: none
        }

        li a:hover {
            background: #9ca3af;
            color: #fff
        }

        li a.active {
            background: #6b7280;
            color: #fff
        }
    </style>
</head>

<body>
    <ul>
        <li><a class="active" href="#">Beranda</a></li>
        <li><a href="#">Berita</a></li>
        <li><a href="#">Kontak</a></li>
        <li><a href="#">Tentang</a></li>
    </ul>
    <p style="padding:20px">Tema abu-abu.</p>
</body>

</html>
