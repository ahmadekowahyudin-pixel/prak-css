<!DOCTYPE html>
<!-- pseudo_class1.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class 1 (Link)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        a:link {
            color: blue
        }

        a:visited {
            color: purple
        }

        a:hover {
            color: red
        }

        a:active {
            color: orange
        }
    </style>
</head>

<body>
    <h1>:link :visited :hover :active</h1>
    <p><a href="#x">Link contoh</a></p>
</body>

</html>
