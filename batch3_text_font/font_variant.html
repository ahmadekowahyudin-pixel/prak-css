<!doctype html>
<!-- font_variant.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Variant</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        font-variant: norma;
      }
      .b {
        font-variant: small-caps;
      }
    </style>
  </head>
  <body>
    <p class="a">Belajar CSS Dasar (normal)</p>
    <p class="b">Belajar CSS Dasar (small-caps)</p>
  </body>
</html>
