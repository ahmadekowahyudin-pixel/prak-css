<!doctype html>
<!-- text_letter_spacing.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter Spacing</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        letter-spacing: 5px;
      }
      .b {
        letter-spacing: -2px;
      }
      .c {
        letter-spacing: 0.3em;
      }
    </style>
  </head>
  <body>
    <h2 class="a">letter-spacing: 5px</h2>
    <h2 class="b">letter-spacing: -2px</h2>
    <h2 class="c">letter-spacing: 0.3em</h2>
    <h2>Normal</h2>
  </body>
</html>
