<!doctype html>
<!-- text_transformation.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Transformation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        text-transform: uppercase;
      }
      .b {
        text-transform: lowercase;
      }
      .c {
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <p class="a">uppercase: belajar css itu menyenangkan</p>
    <p class="b">LOWERCASE: BELAJAR CSS ITU MENYENANGKAN</p>
    <p class="c">capitalize: belajar css itu menyenangkan</p>
  </body>
</html>
