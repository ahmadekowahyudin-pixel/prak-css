<!doctype html>
<!-- font_size.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Size</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        font-size: 12px;
      }
      .b {
        font-size: 1.5em;
      }
      .c {
        font-size: 150%;
      }
      .d {
        font-size: 2rem;
      }
      .e {
        font-size: x-large;
      }
      .f {
        font-size: 5vw;
      }
    </style>
  </head>
  <body>
    <p class="a">12px</p>
    <p class="b">1.5em</p>
    <p class="c">150%</p>
    <p class="d">2rem</p>
    <p class="e">x-large (keyword)</p>
    <p class="f">5vw (mengikuti lebar layar)</p>
  </body>
</html>
