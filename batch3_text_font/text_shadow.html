<!doctype html>
<!-- text_shadow.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Shadow</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      h1 {
        font-size: 48px;
        margin: 20px 0;
      }
      .a {
        text-shadow: 3px 3px 5px #888;
      }
      .b {
        color: #fff;
        background: #333;
        text-shadow:
          0 0 10px #0ff,
          0 0 20px #0ff;
      }
      .c {
        text-shadow:
          2px 2px red,
          4px 4px blue;
      }
    </style>
  </head>
  <body>
    <h1 class="a">Shadow abu-abu</h1>
    <h1 class="b">Efek glow</h1>
    <h1 class="c">Multi shadow</h1>
  </body>
</html>
