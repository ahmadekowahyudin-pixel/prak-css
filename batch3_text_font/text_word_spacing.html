<!doctype html>
<!-- text_word_spacing.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Spacing</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        word-spacing: 20px;
      }
      .b {
        word-spacing: -5px;
      }
      .c {
        word-spacing: 0.5em;
      }
    </style>
  </head>
  <body>
    <p class="a">word-spacing 20px pada kalimat ini</p>
    <p class="b">word-spacing -5px pada kalimat ini</p>
    <p class="c">word-spacing 0.5em pada kalimat ini</p>
    <p>Normal pada kalimat ini</p>
  </body>
</html>
