<!doctype html>
<!-- font_shorthand.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Shorthand</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        font:
          italic small-caps bold 20px/1.5 Georgia,
          serif;
      }
      .b {
        font:
          16px Arial,
          sans-serif;
      }
      .c {
        font:
          bold 1.5em "Courier New",
          monospace;
      }
    </style>
  </head>
  <body>
    <p class="a">font: italic small-caps bold 20px/1.5 Georgia</p>
    <p class="b">font: 16px Arial</p>
    <p class="c">font: bold 1.5em Courier New</p>
  </body>
</html>
