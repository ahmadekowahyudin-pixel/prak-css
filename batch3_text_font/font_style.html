<!doctype html>
<!-- font_style.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Style</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        font-style: normal;
      }
      .b {
        font-style: italic;
      }
      .c {
        font-style: oblique;
      }
    </style>
  </head>
  <body>
    <p class="a">normal</p>
    <p class="b">italic</p>
    <p class="c">oblique</p>
  </body>
</html>
