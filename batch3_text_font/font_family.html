<!doctype html>
<!-- font_family.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Family</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        font-family: "Times New Roman", Times, serif;
      }
      .b {
        font-family: Arial, Helvetica, sans-serif;
      }
      .c {
        font-family: "Courier New", monospace;
      }
      .d {
        font-family: cursive;
      }
    </style>
  </head>
  <body>
    <p class="a">Serif: Times New Roman</p>
    <p class="b">Sans-serif: Arial</p>
    <p class="c">Monospace: Courier New</p>
    <p class="d">Cursive (generic)</p>
  </body>
</html>
