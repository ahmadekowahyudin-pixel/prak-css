<!doctype html>
<!-- font_weight.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Weight</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        font-weight: normal;
      }
      .b {
        font-weight: bold;
      }
      .c {
        font-weight: 300;
      }
      .d {
        font-weight: 600;
      }
      .e {
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <p class="a">normal</p>
    <p class="b">bold</p>
    <p class="c">300</p>
    <p class="d">600</p>
    <p class="e">900</p>
  </body>
</html>
