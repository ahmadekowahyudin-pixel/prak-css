<!doctype html>
<!-- text_warna.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Warna</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .a {
        color: red;
      }
      .b {
        color: #0066cc;
      }
      .c {
        color: rgb(0, 128, 0);
      }
      .d {
        color: hsl(280, 70%, 40%);
      }
    </style>
  </head>
  <body>
    <h1>Warna Teks</h1>
    <p class="a">Merah (nama)</p>
    <p class="b">Biru (HEX)</p>
    <p class="c">Hijau (RGB)</p>
    <p class="d">Ungu (HSL)</p>
  </body>
</html>
