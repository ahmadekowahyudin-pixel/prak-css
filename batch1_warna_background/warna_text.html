<!DOCTYPE html>
<!-- warna_text.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warna Text</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        h1 {
            color: crimson
        }

        .a {
            color: #0066cc
        }

        .b {
            color: rgb(0, 128, 0)
        }

        .c {
            color: hsl(280, 70%, 40%)
        }
    </style>
</head>

<body>
    <h1>Warna Text</h1>
    <p class="a">Teks berwarna biru (#0066cc).</p>
    <p class="b">Teks berwarna hijau (rgb).</p>
    <p class="c">Teks berwarna ungu (hsl).</p>
</body>

</html>
