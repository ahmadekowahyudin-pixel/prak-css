<!DOCTYPE html>
<!-- warna_border.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warna Border</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        div {
            padding: 15px;
            margin-bottom: 15px;
            border-style: solid;
            border-width: 4px
        }

        .a {
            border-color: red
        }

        .b {
            border-color: #0066cc
        }

        .c {
            border-color: rgb(0, 150, 0)
        }

        .d {
            border-color: red green blue orange
        }
    </style>
</head>

<body>
    <div class="a">Border merah</div>
    <div class="b">Border biru (HEX)</div>
    <div class="c">Border hijau (RGB)</div>
    <div class="d">Empat warna: atas merah, kanan hijau, bawah biru, kiri oranye</div>
</body>

</html>
