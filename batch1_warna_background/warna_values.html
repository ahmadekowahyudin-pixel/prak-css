<!DOCTYPE html>
<!-- warna_values.html -->
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Warna</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px
        }

        div {
            padding: 12px;
            margin-bottom: 8px;
            color: #fff
        }

        .n {
            background-color: tomato
        }

        .h {
            background-color: #ff6347
        }

        .r {
            background-color: rgb(255, 99, 71)
        }

        .ra {
            background-color: rgba(255, 99, 71, 0.5);
            color: #000
        }

        .hs {
            background-color: hsl(9, 100%, 64%)
        }

        .hsa {
            background-color: hsla(9, 100%, 64%, 0.5);
            color: #000
        }
    </style>
</head>

<body>
    <h1>Nilai Warna di CSS</h1>
    <div class="n">Nama warna: tomato</div>
    <div class="h">HEX: #ff6347</div>
    <div class="r">RGB: rgb(255,99,71)</div>
    <div class="ra">RGBA: rgba(255,99,71,0.5)</div>
    <div class="hs">HSL: hsl(9,100%,64%)</div>
    <div class="hsa">HSLA: hsla(9,100%,64%,0.5)</div>
</body>

</html>
