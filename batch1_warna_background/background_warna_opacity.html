<!doctype html>
<!-- background_warna_opacity.html -->
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Warna Opacity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #eee;
    }

    div {
      background-color: #2563eb;
      color: #fff;
      padding: 20px;
      margin-bottom: 10px;
      width: 300px;
    }

    .o1 {
      opacity: 1;
    }

    .o5 {
      opacity: 0.5;
    }

    .o2 {
      opacity: 0.2;
    }
  </style>
</head>

<body>
  <h1>Opacity pada Background</h1>
  <div class="o1">opacity: 1 (penuh)</div>
  <div class="o5">opacity: 0.5 (teks ikut transparan)</div>
  <div class="o2">opacity: 0.2 (teks ikut transparan)</div>
</body>

</html>
