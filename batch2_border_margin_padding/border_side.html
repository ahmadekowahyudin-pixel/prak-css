<!doctype html>
<!-- border_side.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Sisi</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      p {
        padding: 10px;
        margin: 10px 0;
      }
      .a {
        border-top: 4px solid red;
      }
      .b {
        border-right: 4px dashed green;
      }
      .c {
        border-bottom: 4px dotted blue;
      }
      .d {
        border-left: 8px solid orange;
      }
      .e {
        border-bottom: 2px solid #333;
      }
    </style>
  </head>
  <body>
    <p class="a">Hanya border-top</p>
    <p class="b">Hanya border-right</p>
    <p class="c">Hanya border-bottom</p>
    <p class="d">Hanya border-left</p>
    <p class="e">Garis bawah tipis</p>
  </body>
</html>
