<!doctype html>
<!-- border_warna.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Warna</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      p {
        border-style: solid;
        border-width: 5px;
        padding: 8px;
        margin: 8px 0;
      }
      .a {
        border-color: red;
      }
      .b {
        border-color: #00aa00;
      }
      .c {
        border-color: rgb(0, 0, 255);
      }
      .d {
        border-color: red green blue orange;
      }
    </style>
  </head>
  <body>
    <p class="a">Merah</p>
    <p class="b">Hijau HEX</p>
    <p class="c">Biru RGB</p>
    <p class="d">Empat warna berbeda</p>
  </body>
</html>
