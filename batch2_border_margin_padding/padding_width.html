<!doctype html>
<!-- padding_width.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padding dan Width</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        width: 300px;
        background: #dbeafe;
        border: 1px solid #2563eb;
        margin-bottom: 15px;
      }
      .a {
      }
      .b {
        padding: 25px;
      }
    </style>
  </head>
  <body>
    <h1>Padding dan Width</h1>
    <div class="a">width 300px tanpa padding (total lebar 300px)</div>
    <div class="b">width 300px + padding 25px (total lebar 350px)</div>
  </body>
</html>
