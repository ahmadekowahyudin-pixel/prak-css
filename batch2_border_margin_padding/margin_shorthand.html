<!doctype html>
<!-- margin_shorthand.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Shorthand</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        background: #dbeafe;
        border: 1px solid #2563eb;
      }
      .wrap {
        background: #fef3c7;
        border: 1px dashed #f59e0b;
        width: 320px;
        margin-bottom: 15px;
      }
      .wrap {
        overflow: hidden;
      }
      div.m {
        margin: 10px 20px 30px 40px;
      }
    </style>
  </head>
  <body>
    <h1>Margin Shorthand</h1>
    <div class="wrap">
      <div class="m">margin: 10px 20px 30px 40px (atas kanan bawah kiri)</div>
    </div>
  </body>
</html>
