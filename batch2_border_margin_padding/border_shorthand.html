<!doctype html>
<!-- border_shorthand.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Shorthand</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      p {
        padding: 10px;
        margin: 10px 0;
      }
      .a {
        border: 5px solid red;
      }
      .b {
        border: 2px dashed #0066cc;
      }
      .c {
        border-left: 6px double green;
        border-right: 6px double green;
      }
    </style>
  </head>
  <body>
    <p class="a">border: 5px solid red</p>
    <p class="b">border: 2px dashed #0066cc</p>
    <p class="c">border-left &amp; border-right double</p>
  </body>
</html>
