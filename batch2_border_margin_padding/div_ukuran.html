<!doctype html>
<!-- div_ukuran.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ukuran Div</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        background: #dbeafe;
        border: 1px solid #2563eb;
        margin-bottom: 10px;
      }
      .a {
        height: 80px;
        width: 200px;
      }
      .b {
        height: 50px;
        width: 50%;
      }
      .c {
        height: auto;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Ukuran Div</h1>
    <div class="a">200px x 80px</div>
    <div class="b">lebar 50%, tinggi 50px</div>
    <div class="c">lebar 100%, tinggi auto</div>
  </body>
</html>
