<!doctype html>
<!-- border_radius.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Radius</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        border: 3px solid #2563eb;
        background: #dbeafe;
        padding: 20px;
        margin: 10px 0;
        width: 250px;
      }
      .a {
        border-radius: 5px;
      }
      .b {
        border-radius: 25px;
      }
      .c {
        border-radius: 50%;
        width: 150px;
        height: 150px;
        text-align: center;
        line-height: 110px;
        padding: 0;
      }
      .d {
        border-radius: 30px 0 30px 0;
      }
    </style>
  </head>
  <body>
    <div class="a">radius 5px</div>
    <div class="b">radius 25px</div>
    <div class="c">Lingkaran</div>
    <div class="d">30px 0 30px 0</div>
  </body>
</html>
