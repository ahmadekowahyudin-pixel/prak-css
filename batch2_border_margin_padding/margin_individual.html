<!doctype html>
<!-- margin_individual.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Individual</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        background: #dbeafe;
        border: 1px solid #2563eb;
      }
      .wrap {
        background: #fef3c7;
        border: 1px dashed #f59e0b;
        width: 320px;
        margin-bottom: 15px;
      }
      .wrap {
        padding: 0;
      }
      div.m {
        margin-top: 20px;
        margin-right: 40px;
        margin-bottom: 30px;
        margin-left: 60px;
      }
    </style>
  </head>
  <body>
    <h1>Margin Individual</h1>
    <div class="wrap">
      <div class="m">margin-top 20, right 40, bottom 30, left 60</div>
    </div>
  </body>
</html>
