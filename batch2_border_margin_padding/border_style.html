<!doctype html>
<!-- border_style.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Style</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      p {
        border-width: 3px;
        border-color: #2563eb;
        padding: 8px;
        margin: 8px 0;
      }
      .a {
        border-style: solid;
      }
      .b {
        border-style: dotted;
      }
      .c {
        border-style: dashed;
      }
      .d {
        border-style: double;
      }
      .e {
        border-style: groove;
      }
      .f {
        border-style: ridge;
      }
      .g {
        border-style: inset;
      }
      .h {
        border-style: outset;
      }
      .i {
        border-style: none;
      }
    </style>
  </head>
  <body>
    <p class="a">solid</p>
    <p class="b">dotted</p>
    <p class="c">dashed</p>
    <p class="d">double</p>
    <p class="e">groove</p>
    <p class="f">ridge</p>
    <p class="g">inset</p>
    <p class="h">outset</p>
    <p class="i">none</p>
  </body>
</html>
