<!doctype html>
<!-- box_model.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
      }
      .box {
        width: 250px;
        height: 100px;
        padding: 20px;
        border: 10px solid #2563eb;
        margin: 30px;
        background: #dbeafe;
        outline: 1px dashed #999;
        outline-offset: 30px;
      }
    </style>
  </head>
  <body>
    <h1>Box Model</h1>
    <div class="box">
      Content (250 x 100) + padding 20px + border 10px + margin 30px
    </div>
  </body>
</html>
