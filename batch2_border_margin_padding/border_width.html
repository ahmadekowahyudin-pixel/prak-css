<!doctype html>
<!-- border_width.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border Width</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      p {
        border-style: solid;
        border-color: #333;
        padding: 8px;
        margin: 8px 0;
      }
      .a {
        border-width: thin;
      }
      .b {
        border-width: medium;
      }
      .c {
        border-width: thick;
      }
      .d {
        border-width: 10px;
      }
      .e {
        border-width: 2px 10px 4px 20px;
      }
    </style>
  </head>
  <body>
    <p class="a">thin</p>
    <p class="b">medium</p>
    <p class="c">thick</p>
    <p class="d">10px</p>
    <p class="e">2px 10px 4px 20px (atas kanan bawah kiri)</p>
  </body>
</html>
