<!doctype html>
<!-- padding_individual.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padding Individual</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        background: #dbeafe;
        border: 1px solid #2563eb;
        width: 300px;
        margin-bottom: 15px;
      }
      .p {
        padding-top: 10px;
        padding-right: 40px;
        padding-bottom: 30px;
        padding-left: 60px;
      }
    </style>
  </head>
  <body>
    <h1>Padding Individual</h1>
    <div class="p">top 10, right 40, bottom 30, left 60</div>
  </body>
</html>
