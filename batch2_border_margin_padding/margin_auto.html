<!doctype html>
<!-- margin_auto.html -->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin Auto</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      div {
        width: 300px;
        margin: 20px auto;
        padding: 15px;
        background: #dbeafe;
        border: 1px solid #2563eb;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Margin Auto</h1>
    <div>
      Elemen ini berada di tengah horizontal karena width tetap dan margin:
      auto.
    </div>
  </body>
</html>
